# テスト用のローカル Postgres（B-07d / ADR-029 決定4・結果5）。
#
# **ボリュームを置かない** — 使い捨てであり、状態は globalSetup が毎回作り直す。
# 版は実物と一致している。実 Supabase は PostgreSQL 17.6 だった（B-07h で確認）。
# ローカルの素の Postgres が 16 であるずれは ADR-030 の結果1 が引き受けたとおり残す（正は CI）。
#
#   pnpm db:up   起き切るまで待って起動する
#   pnpm db:down 消す
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - '55432:5432'
    volumes:
      # 役と auth.uid() を用意する。initdb で1度だけ走る。
      - ./supabase/local/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # 検査は TCP で行う。initdb 中の一時サーバは UNIX ソケットしか開かないため、
      # ソケット越しに問うと**初期化の途中で成功してしまう**（設計 規則10）。
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 1s
      timeout: 5s
      retries: 60
