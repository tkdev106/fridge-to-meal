name = "fridge-to-meal-api"
main = "src/main.ts"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat"]

# Cloudflare への利用統計の送信を止める。開発環境によっては送信先に届かず、
# 無関係なエラーがログに混ざって原因の切り分けを妨げる。
send_metrics = false

# Supabase への接続情報は環境変数で渡す（ADR-020）。
# 開発時は apps/api/.dev.vars（gitignore 済み）に置く。
#   SUPABASE_URL="https://xxxx.supabase.co"
#   SUPABASE_ANON_KEY="..."
#
# ⚠ service_role キーは置かない。RLS を迂回してしまい、Supabase を選んだ
#   理由（世帯分離の安全網）が消える。利用者の JWT で問い合わせること。
#
# ⚠ LLM の API キーもここに置く。クライアントには絶対に置かない（NFR-10）。
