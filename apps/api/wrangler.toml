name = "fridge-to-meal-api"
main = "src/main.ts"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat"]

# Cloudflare への利用統計の送信を止める。開発環境によっては送信先に届かず、
# 無関係なエラーがログに混ざって原因の切り分けを妨げる。
send_metrics = false

# Postgres への接続情報はここにも .dev.vars にも置かない。Hyperdrive の設定（Cloudflare 側）が
# 持ち、main.ts は env.HYPERDRIVE.connectionString を読む（ADR-042 決定2 / B-07f で実測）。
#
# binding は下に置いてある（B-09 で結線）。binding があると wrangler dev はローカル用の
# 接続文字列 CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE を要求するが、
# 手元では package.json の dev スクリプトがローカル Postgres の authenticator を既定で渡す。
# 外から同じ名で与えれば、そちらが優先される。localConnectionString はここに書かない —
# 接続文字列をこのファイルに置かない規則の一部である。
#
# id は B-07f で作った Hyperdrive のもの（秘密ではない。ADR-042 結果2）。この設定の
# 問い合わせキャッシュが切れていることは 2026-09-19 にユーザーが確かめた（ADR-044 決定3）。
# 別の環境を立てたときは wrangler hyperdrive get <id> で caching.disabled を見る —
# リポジトリの側からは検査できない設定である。
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "fefe9ddf248f42388c89824cf08a7445"

# 環境変数で渡すのは認証（Supabase Auth）用の2つだけ。開発時は apps/api/.dev.vars（gitignore 済み）。
#   SUPABASE_URL="https://xxxx.supabase.co"   認証用。DB アクセスには使わない
#   SUPABASE_ANON_KEY="..."                   同上
#
# ⚠ Workers から Postgres へ直接 TCP で繋がない。到達はできるが、TLS を要求すると接続の
#   やり直しが繰り返され、1リクエストあたりの外向き接続数の上限に当たって落ちる（B-07f）。
#   NFR-08 は例外を認めていないので TLS を捨てる道は無い。Hyperdrive を挟む（ADR-042）。
#
# ⚠ ドライバには prepare: false と fetch_types: false を与える（ADR-042 決定3）。
#
# ⚠ Hyperdrive の問い合わせキャッシュを切る（caching.disabled。ADR-044）。読み取りはすべて世帯で
#   絞られていてキャッシュから得るものが無い一方、噛み合わなければ他世帯の在庫が黙って返る。
#   この設定は Cloudflare 側にあり、ここからは検査できない — wrangler hyperdrive get <id> で見る。
#
# ⚠ SUPABASE_JWT_SECRET は使わない。検証は JWKS（ES256）で行う（ADR-043）。取りに行く先は
#   <SUPABASE_URL>/auth/v1/.well-known/jwks.json で、公開鍵の一覧なので秘密ではない。
#
# ⚠ service_role キーと、表の所有者ロールの接続文字列を Hyperdrive の設定にも置かない。
#   どちらも RLS を迂回してしまい、Supabase を選んだ理由（世帯分離の安全網）が消える。
#   接続に使うのは表を持たない非所有者のログインロールである（ADR-029 決定3(b)）。
#
# ⚠ 読み書きは 1リクエスト1トランザクションで行い、その中で set local role と
#   set local request.jwt.claims を張る。local を落とさない — 接続プーラは接続を貸し回すため、
#   セッションに残した設定は他人のリクエストに漏れる。
#
# ⚠ LLM の API キーは .dev.vars（gitignore 済み）と wrangler secret に置く。このファイルは git 管理下
#   なので、秘密を1つも書かない。クライアントにも絶対に置かない（NFR-10）。

# 献立の生成に使うモデル名（ADR-078 決定4）。モデルを替えるときに変えるのはこの1か所だけで、
# コードに既定値は無い。無料枠から有料枠へ移るときも、ここではなくキーの側である。
# API キーは GEMINI_API_KEY という名前で、本番は wrangler secret put で、手元は .dev.vars に置く。
# ここには書かない（NFR-10）。
[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
