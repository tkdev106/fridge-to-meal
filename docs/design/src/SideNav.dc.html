<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Zen+Kaku+Gothic+New:wght@400;500&amp;display=swap" rel="stylesheet"></helmet>
<nav style="box-sizing:border-box;width:240px;height:100%;min-height:{{ mh }};display:flex;flex-direction:column;padding:40px 0 32px;background:#FAF9F6;border-right:1px solid #E3DED6;color:#1F1E1B;font-family:var(--ftm-font, 'Inter', 'Zen Kaku Gothic New', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', system-ui, sans-serif)">
  <div style="height:48px;display:flex;align-items:center;padding:0 24px;font-family:'Inter', sans-serif;font-weight:500;font-size:14px;letter-spacing:0.16em;white-space:nowrap">fridge to meal</div>
  <div style="margin-top:32px;display:flex;flex-direction:column">
    <sc-for list="{{ items }}" as="t" hint-placeholder-count="3">
      <div style="position:relative;height:48px;display:flex;align-items:center;gap:12px;padding:0 24px;font-size:16px;letter-spacing:0.02em;font-weight:{{ t.w }};cursor:pointer" style-hover="background:#FFFFFF">
        <sc-if value="{{ t.active }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:0;top:12px;bottom:12px;width:2px;background:#1F1E1B"></div></sc-if>
        <dc-import name="Icon" icon="{{ t.icon }}" size="20" hint-size="20px,20px"></dc-import>
        <span>{{ t.label }}</span>
      </div>
    </sc-for>
  </div>
  <div style="position:relative;margin-top:auto;height:48px;display:flex;align-items:center;gap:12px;padding:0 24px;font-size:16px;letter-spacing:0.02em;font-weight:{{ sw }};cursor:pointer">
    <sc-if value="{{ settings }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:0;top:12px;bottom:12px;width:2px;background:#1F1E1B"></div></sc-if>
    <dc-import name="Icon" icon="settings" size="20" hint-size="20px,20px"></dc-import>
    <span>設定</span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;meal&quot;,&quot;pantry&quot;,&quot;history&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;meal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;minHeight&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:900,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'meal';
    const items = [['meal', '献立'], ['pantry', '冷蔵庫'], ['history', '履歴']].map(([k, label]) => ({ label, icon: k, active: a === k, w: a === k ? 500 : 400 }));
    return { items, settings: a === 'settings', sw: a === 'settings' ? 500 : 400, mh: (this.props.minHeight ?? 900) + 'px' };
  }
}
</script>
</body>
</html>
